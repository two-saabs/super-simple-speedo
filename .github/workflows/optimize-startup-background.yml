name: Optimize startup background

on:
  push:
    branches:
      - frenano-webapp-test
    paths:
      - '.github/workflows/optimize-startup-background.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Create web-optimized backgrounds
        run: |
          mkdir -p optimized-backgrounds
          SRC="images/frenano-hero-background.jpg"

          # Lightweight portrait asset for the webapp startup screen.
          # Crop from the centre to match a modern phone viewport, then encode as WebP.
          convert "$SRC" \
            -gravity center \
            -crop 434x941+0+0 +repage \
            -resize 600x1300^ \
            -gravity center \
            -extent 600x1300 \
            -strip \
            -quality 72 \
            optimized-backgrounds/frenano-hero-background-web.webp

          # Separate landscape asset for the public website/desktop presentation.
          convert "$SRC" \
            -resize '1600x1600>' \
            -strip \
            -quality 76 \
            optimized-backgrounds/frenano-hero-background-web-full.webp

          ls -lh optimized-backgrounds
          identify optimized-backgrounds/*.webp

      - name: Upload optimized images
        uses: actions/upload-artifact@v4
        with:
          name: frenano-web-backgrounds
          path: optimized-backgrounds/*.webp
          if-no-files-found: error
          retention-days: 7
