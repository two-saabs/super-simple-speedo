Excellent question. This is exactly the right time to understand the structure before adding more files.

The short answer is:

Everything we're talking about belongs in your project repository. The only exception is the GitHub workflow, which lives in .github/workflows.

Think of your repository as the project folder on your computer.

Today it probably looks something like:

super-simple-speedo/
│
├── index.template.html
├── check-regressions.js
└── .github/
    └── workflows/
        └── quality-gate.yml

That's a nice, simple structure.

Where does test-data go?

Alongside index.template.html.

super-simple-speedo/
│
├── index.template.html
├── check-regressions.js
├── test-data/
│   ├── stationary-start.json
│   ├── gps-jump.json
│   ├── train.json
│   └── normal-drive.json
│
└── .github/
    └── workflows/
        └── quality-gate.yml

Why?

Because these are part of the project, not part of GitHub Actions. They are test fixtures—sample journeys that we use whenever we want to check the app's behaviour.

Where does test-speed-engine.js go?

Also alongside check-regressions.js.

super-simple-speedo/
│
├── index.template.html
├── check-regressions.js
├── test-speed-engine.js
├── test-data/
│   ├── ...
│
└── .github/

Again, it's part of your code, not part of GitHub.

GitHub simply runs it.

What stays inside .github/workflows?

Only workflow files.

For now, just:

.github/
└── workflows/
    └── quality-gate.yml

Think of that folder as GitHub's "instruction manual."

It should stay very small.

A useful way to think about it

Imagine GitHub is a chef.

Your repository is the kitchen.

Repository
│
├── The recipe
│      quality-gate.yml
│
├── The ingredients
│      index.template.html
│      speed-engine.js
│
├── The inspector
│      check-regressions.js
│
└── Sample ingredients for testing
       test-data/

GitHub doesn't care how many files you have.

It simply follows the recipe.

Where I'd eventually like the project to end up

Not today—but perhaps over the next few months—as the app grows, I'd aim for something like this:

super-simple-speedo/
│
├── index.template.html        ← the app
├── speed-engine.js            ← speed calculations
├── road-engine.js             ← road confirmation logic
│
├── check-regressions.js       ← quality contract tests
├── test-speed-engine.js       ← behaviour tests
│
├── test-data/
│   ├── stationary-start.json
│   ├── gps-jump.json
│   ├── train.json
│   └── motorway.json
│
├── docs/
│   ├── DESIGN.md
│   └── DECISIONS.md
│
└── .github/
    └── workflows/
        └── quality-gate.yml

Notice something interesting:

Most of the files are your project.
Only one file belongs to GitHub.
One suggestion before we go further

I'd actually pause here and resist adding lots of files straight away.

You've just got your first CI pipeline working, which is a great milestone. Before we introduce speed-engine.js and behaviour tests, I'd spend a little time tidying the repository itself:

Add a README.md explaining what Super Simple Speedo is, how to run the quality gate, and what the project philosophy is.
Add a .gitignore so temporary files, logs, and editor settings don't accidentally get committed.

Those two files are standard in almost every GitHub project, and they'll make the repository feel much more complete before we expand the codebase. Based on what I know about your goals for this app, I'd make those the next improvements before introducing more JavaScript modules.

