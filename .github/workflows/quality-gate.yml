Check product and diagnostic contracts
Replay speed behaviour fixtures
Important limitation

The new speed-engine.js is currently an extracted, testable version of the app’s speed rules.

The live HTML still contains its own embedded copy of those rules. Therefore, the tests currently prove that the extracted engine behaves correctly, but the app is not yet directly calling that module.

The next architectural step is to connect index.template.html to speed-engine.js, so the live app and automated tests use exactly one shared implementation.

