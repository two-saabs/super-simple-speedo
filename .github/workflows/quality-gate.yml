name: Frenano website quality gate

on:
  push:
    paths:
      - "home.html"
      - "build.js"
      - "index.template.html"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "tests/**"
      - "speed-engine.js"
      - "netlify/**"
      - "netlify.toml"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "home.html"
      - "build.js"
      - "index.template.html"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "tests/**"
      - "speed-engine.js"
      - "netlify/**"
      - "netlify.toml"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Frenano website assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          function checkPng(path) {
            const data = fs.readFileSync(path);
            const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            if (data.length < 1000 || !data.subarray(0,8).equals(signature)) throw new Error(`${path} is not a valid production PNG`);
          }
          [
            'images/frenano-website-icon-512.png',
            'images/frenano-startup-logo-512.png',
            'images/frenano-running-logo-256.png',
            'images/dark-41-confirmed.png',
            'images/light-41-confirmed.png',
            'images/dark-40-unconfirmed.png',
            'images/dark-settings.png'
          ].forEach(checkPng);
          if (!fs.existsSync('images/frenano-hero-background.jpg')) throw new Error('Hero background missing');
          NODE

      - name: Verify native lookup proxy contract
        run: |
          test -f netlify/functions/geoapify-proxy.js
          grep -q 'process.env.GEOAPIFY_API_KEY' netlify/functions/geoapify-proxy.js
          grep -q 'action === "reverse"' netlify/functions/geoapify-proxy.js
          grep -q 'action === "mapmatching"' netlify/functions/geoapify-proxy.js
          grep -q 'Access-Control-Allow-Origin' netlify/functions/geoapify-proxy.js

      - name: Check product and diagnostic contracts
        run: node tests/check-regressions.js index.template.html

      - name: Check production privacy contracts
        run: node tests/check-privacy.js

      - name: Replay speed behaviour fixtures
        run: node tests/test-speed-engine.js

      - name: Measure core speed-engine coverage
        run: node --test --experimental-test-coverage tests/test-speed-engine.js

      - name: Build website and web app
        env:
          GEOAPIFY_API_KEY: test-key-not-for-production
        run: node build.js

      - name: Check release-channel contracts
        run: node tests/check-channel-contract.js

      - name: Verify homepage hero and screenshots
        run: |
          grep -q 'Frenano' dist/index.html
          grep -q 'frenano-hero-background.jpg' dist/index.html
          grep -q 'frenano-phone-polish-v2' dist/index.html
          grep -q 'dark-41-confirmed.png' dist/index.html
          grep -q 'light-41-confirmed.png' dist/index.html
          grep -q 'dark-40-unconfirmed.png' dist/index.html
          grep -q 'dark-settings.png' dist/index.html
          grep -q 'iphone-frame' dist/index.html

      - name: Verify approved app contract
        run: |
          test -f dist/app/index.html
          grep -q 'Frenano — GPS speedometer, simply done.' dist/app/index.html
          grep -q 'acceptedAutoPosition' dist/app/index.html
          grep -q 'Last confirmed limit' dist/app/index.html
          grep -q 'Appearance & Display' dist/app/index.html
          grep -q 'data-settings-section="audio" aria-hidden="true"' dist/app/index.html
          grep -q 'support@frenano.app' dist/app/index.html
          grep -q 'Share diagnostic log' dist/app/index.html
          grep -q 'Nothing is uploaded automatically' dist/app/index.html
          grep -q 'Experimental transport API disabled in stable build' dist/app/index.html
          grep -q 'frenano-startup-logo-512.png' dist/app/index.html
          grep -q 'simple-startup-v3' dist/app/index.html
          grep -q 'frenano-startup-flow-v4' dist/app/index.html
          grep -q 'frenano-location-intro' dist/app/index.html
          grep -q 'I’m OK with that' dist/app/index.html
          grep -q 'id="frenanoReadyButton"' dist/app/index.html
          grep -q '>Let’s go!<' dist/app/index.html
          grep -q 'frenanoLocationIntroSeenV1' dist/app/index.html
          grep -q 'Completely free · No account or subscription needed · No advertisements · Private · Made in Switzerland' dist/app/index.html
          grep -q 'settings-top-close' dist/app/index.html
          ! grep -q 'TEST VERSION' dist/app/index.html
