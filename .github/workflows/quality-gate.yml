What each test proves

The five JSON fixtures cover:

Stationary startup
Native GPS says zero while the coordinates wobble. The screen remains at zero.
Impossible GPS jump
A sudden coordinate jump produces an absurd derived speed. It is rejected.
Normal driving speed
A native GPS speed of 50 km/h is accepted and activates Driver Mode.
Derived-speed confirmation
Position-derived movement from stationary must repeat consistently three times before acceptance.
Poor GPS accuracy
Movement calculated from a 120-metre accuracy reading remains unconfirmed.
