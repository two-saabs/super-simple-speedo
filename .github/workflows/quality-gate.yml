name: Frenano quality gate

on:
  push:
    paths:
      - "index.template.html"
      - "home.html"
      - "build.js"
      - "build-ios.js"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "brains/**"
      - "tests/**"
      - "ios-tests/**"
      - "speed-engine.js"
      - "native-ios.js"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "index.template.html"
      - "home.html"
      - "build.js"
      - "build-ios.js"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "brains/**"
      - "tests/**"
      - "ios-tests/**"
      - "speed-engine.js"
      - "native-ios.js"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Frenano production assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          function checkPng(path, w, h) {
            const data = fs.readFileSync(path);
            const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            if (!data.subarray(0,8).equals(sig)) throw new Error(`${path} is not PNG`);
            const width=data.readUInt32BE(16), height=data.readUInt32BE(20);
            if (width !== w || height !== h) throw new Error(`${path} is ${width}x${height}; expected ${w}x${h}`);
            console.log(`${path}: ${width}x${height}`);
          }
          checkPng('images/frenano-app-icon-1024.png',1024,1024);
          checkPng('images/frenano-startup-logo-512.png',512,512);
          checkPng('images/frenano-running-logo-256.png',256,256);
          checkPng('images/frenano-website-icon-512.png',512,512);
          NODE

      - name: Check product contracts
        run: node tests/check-regressions.js index.template.html

      - name: Check removed-feature contracts
        run: node tests/check-dead-feature-purge.js

      - name: Check visible elements contract
        run: node tests/check-visible-elements.js

      - name: Check native Road Card contract
        run: node tests/check-road-card.js

      - name: Check native Usage Statistics contract
        run: node tests/check-usage-statistics.js

      - name: Check native Speed Display Units contract
        run: node tests/check-speed-display-units.js

      - name: Check build ownership contracts
        run: node tests/check-build-ownership.js

      - name: Check Road Brain contract
        run: node tests/test-road-brain.js

      - name: Check Road Brain runtime and ownership integration
        run: node tests/test-road-brain-integration.js

      - name: Check privacy contracts
        run: node tests/check-privacy.js

      - name: Replay speed behaviour fixtures
        run: node tests/test-speed-engine.js

      - name: Measure core speed-engine coverage
        run: node --test --experimental-test-coverage tests/test-speed-engine.js

      - name: Verify critical iOS keep-awake regression contract
        run: |
          node --test tests/test-ios-keep-awake.js
          grep -q 'configure-ios-keep-awake.js' scripts/ios-sync.js
          grep -q 'configure-ios-keep-awake.js' package.json

      - name: Build Frenano web release
        env:
          GEOAPIFY_API_KEY: test-key-not-for-production
        run: node build.js

      - name: Check current Settings UI contract
        run: |
          node tests/check-settings-ui.js dist/app/index.html
          node tests/check-visible-elements.js dist/app/index.html
          node tests/check-road-card.js dist/app/index.html
          node tests/check-usage-statistics.js dist/app/index.html
          node tests/check-speed-display-units.js dist/app/index.html

      - name: Check release-channel contracts
        run: node tests/check-channel-contract.js

      - name: Verify website and web app branding
        run: |
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/images/frenano-website-icon-512.png
          grep -q 'Frenano' dist/index.html
          grep -q 'Launch web version' dist/index.html
          grep -q 'Frenano' dist/app/index.html
          grep -q 'support@frenano.app' dist/app/index.html
          grep -q 'https://frenano.app/privacy.html' dist/app/index.html
          grep -q 'id="letsDriveButton"' dist/app/index.html
          grep -q 'simple-startup-v5' dist/app/index.html
          grep -q 'positive-onboarding-v5' dist/app/index.html
          grep -q 'frenano-startup-flow-v5' dist/app/index.html
          grep -q 'data-flow="v6-smooth-launch"' dist/app/index.html
          grep -q '>Let’s go!<' dist/app/index.html
          grep -q 'frenanoLocationIntroSeenV1' dist/app/index.html
          grep -q 'returning-native' dist/app/index.html
          grep -q 'GPS speedometer, simply done.' dist/app/index.html
          grep -q 'Simple.<br>Private.<br>Swiss.' dist/app/index.html
          grep -q 'Frenano is developed with<br>privacy and simplicity at its core.' dist/app/index.html
          grep -q '>Completely free<' dist/app/index.html
          grep -q '>No advertisements<' dist/app/index.html
          grep -q 'A clean, focused experience.' dist/app/index.html
          grep -q 'No account or<br>subscription needed' dist/app/index.html
          grep -q 'Just open and go.' dist/app/index.html
          grep -q '>Made in Switzerland<' dist/app/index.html
          grep -q 'Simple by design.' dist/app/index.html
          grep -q 'Respecting and staying within the speed limit<br>is always the responsibility of the driver.' dist/app/index.html
          grep -q 'When asked, allow location access for the best experience.' dist/app/index.html
          grep -q '“Allow While Using App”' dist/app/index.html
          grep -q 'id="frenano-speed-brain-v1"' dist/app/index.html
          grep -q '1.0.0' dist/app/index.html

      - name: Install iOS packaging dependencies
        run: npm install --no-package-lock

      - name: Build Frenano iOS package without local secret
        run: npm run build:ios

      - name: Verify iOS package contract
        run: |
          node tests/check-visible-elements.js dist/index.html
          node tests/check-road-card.js dist/index.html
          node tests/check-usage-statistics.js dist/index.html
          node tests/check-speed-display-units.js dist/index.html
          test -f dist/index.html
          test -f dist/native-ios.bundle.js
          grep -q 'window.__SPEEDO_NATIVE_IOS__ = true' dist/index.html
          grep -q 'https://frenano.app/.netlify/functions/geoapify-proxy' dist/index.html
          grep -q 'Frenano' dist/index.html
          grep -q 'id="native-ios-startup-v2"' dist/index.html
          grep -q 'id="native-ios-startup-script"' dist/index.html
          grep -q 'frenano-startup-flow-v5' dist/index.html
          grep -q 'positive-onboarding-v5' dist/index.html
          grep -q 'returning-native' dist/index.html
          grep -q '>Let’s go!<' dist/index.html
          grep -q 'GPS speedometer, simply done.' dist/index.html
          grep -q 'Simple.<br>Private.<br>Swiss.' dist/index.html
          grep -q 'Frenano is developed with<br>privacy and simplicity at its core.' dist/index.html
          grep -q '>Completely free<' dist/index.html
          grep -q '>No advertisements<' dist/index.html
          grep -q 'A clean, focused experience.' dist/index.html
          grep -q 'No account or<br>subscription needed' dist/index.html
          grep -q 'Just open and go.' dist/index.html
          grep -q '>Made in Switzerland<' dist/index.html
          grep -q 'Simple by design.' dist/index.html
          grep -q 'Respecting and staying within the speed limit<br>is always the responsibility of the driver.' dist/index.html
          grep -q 'When asked, allow location access for the best experience.' dist/index.html
          grep -q '“Allow While Using App”' dist/index.html
          grep -q 'id="frenano-speed-brain-v1"' dist/index.html
          grep -q '1.0.0' dist/index.html
          ! grep -q 'ios-build-placeholder-not-secret' dist/index.html
          ! grep -q 'test-key-not-for-production' dist/index.html
          grep -q '"appName": "Frenano"' capacitor.config.json
          grep -q '"appId": "app.supersimplespeedo.ios"' capacitor.config.json

      - name: Verify native iOS UI regression suite
        run: |
          test -f ios-tests/FrenanoUITests.swift
          grep -q 'testNativeFirstRunLocationIntroThenAutomaticStartup' ios-tests/FrenanoUITests.swift
          grep -q 'testSettingsExposeNativeLocationManagement' ios-tests/FrenanoUITests.swift
          grep -q 'testAboutShowsAppStoreVersion' ios-tests/FrenanoUITests.swift
          grep -q 'testPortraitLandscapePortraitKeepsCoreUIAvailable' ios-tests/FrenanoUITests.swift
          grep -q 'Allow While Using App' ios-tests/FrenanoUITests.swift
          grep -q 'Close settings' ios-tests/FrenanoUITests.swift
