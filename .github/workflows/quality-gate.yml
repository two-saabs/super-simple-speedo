name: Super Simple Speedo quality gate

on:
  push:
    paths:
      - "index.template.html"
      - "check-regressions.js"
      - "speed-engine.js"
      - "test-speed-engine.js"
      - "test-data/**"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "index.template.html"
      - "check-regressions.js"
      - "speed-engine.js"
      - "test-speed-engine.js"
      - "test-data/**"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check product and diagnostic contracts
        run: node check-regressions.js index.template.html

      - name: Replay speed behaviour fixtures
        run: node test-speed-engine.js
