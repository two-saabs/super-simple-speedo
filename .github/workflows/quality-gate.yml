name: Frenano quality gate

on:
  push:
    paths:
      - "index.template.html"
      - "home.html"
      - "build.js"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "tests/**"
      - "speed-engine.js"
      - "netlify/**"
      - "netlify.toml"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "index.template.html"
      - "home.html"
      - "build.js"
      - "build-profile.json"
      - "version.json"
      - "manifest.webmanifest"
      - "images/**"
      - "build/**"
      - "tests/**"
      - "speed-engine.js"
      - "netlify/**"
      - "netlify.toml"
      - "TEST-COVERAGE.md"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Frenano image assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          function checkPng(path) {
            const data = fs.readFileSync(path);
            const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            if (data.length < 1000) throw new Error(`${path} is suspiciously small`);
            if (!data.subarray(0,8).equals(signature)) throw new Error(`${path} is not a PNG`);
          }
          [
            'images/frenano-app-icon-1024.png',
            'images/frenano-startup-logo-512.png',
            'images/frenano-running-logo-256.png',
            'images/frenano-website-icon-512.png'
          ].forEach(checkPng);
          NODE

      - name: Verify native lookup proxy contract
        run: |
          test -f netlify/functions/geoapify-proxy.js
          grep -q 'process.env.GEOAPIFY_API_KEY' netlify/functions/geoapify-proxy.js
          grep -q 'action === "reverse"' netlify/functions/geoapify-proxy.js
          grep -q 'action === "mapmatching"' netlify/functions/geoapify-proxy.js
          grep -q 'Access-Control-Allow-Origin' netlify/functions/geoapify-proxy.js

      - name: Check product and diagnostic contracts
        run: node tests/check-regressions.js index.template.html

      - name: Check production privacy contracts
        run: node tests/check-privacy.js

      - name: Replay speed behaviour fixtures
        run: node tests/test-speed-engine.js

      - name: Measure core speed-engine coverage
        run: node --test --experimental-test-coverage tests/test-speed-engine.js

      - name: Build configured Frenano output
        env:
          GEOAPIFY_API_KEY: test-key-not-for-production
        run: node build.js

      - name: Check release-channel contracts against built output
        run: node tests/check-channel-contract.js

      - name: Verify Frenano branding reached app output
        run: |
          test -f dist/images/frenano-startup-logo-512.png
          test -f dist/images/frenano-running-logo-256.png
          grep -q 'Frenano — GPS speedometer, simply done.' dist/app/index.html
          grep -q 'frenano-startup-logo-512.png' dist/app/index.html
          grep -q 'frenano-running-logo-256.png' dist/app/index.html
          ! grep -q '>Super Simple Speedo<' dist/app/index.html

      - name: Verify first-run aware startup contract
        run: |
          grep -q 'simple-startup-v4' dist/app/index.html
          grep -q 'frenano-startup-flow-v5' dist/app/index.html
          grep -q 'frenano-location-intro' dist/app/index.html
          grep -q 'data-flow="v5-smooth"' dist/app/index.html
          grep -q 'classList.add('\''departing'\'')' dist/app/index.html
          grep -q '>Let’s go!<' dist/app/index.html
          grep -q 'frenanoLocationIntroSeenV1' dist/app/index.html
          grep -q 'returning-native' dist/app/index.html
          grep -q 'Simple.<br>Private.<br>Swiss.' dist/app/index.html
          grep -q 'Completely free · No accounts or subscriptions' dist/app/index.html
          grep -q 'No advertising · Private · Made in Switzerland' dist/app/index.html

      - name: Verify road freshness behaviour
        run: |
          grep -q 'acceptedAutoPosition' dist/app/index.html
          grep -q 'distanceFromConfirmedRoad >= 60' dist/app/index.html
          grep -q 'Last confirmed limit' dist/app/index.html
          grep -q 'setRoadConfidence("estimate", "Best estimate")' dist/app/index.html
          grep -q 'candidateRoad' dist/app/index.html

      - name: Verify simplified release settings contract
        run: |
          grep -q 'data-settings-section="display"' dist/app/index.html
          grep -q 'data-settings-section="about"' dist/app/index.html
          grep -q 'data-settings-section="privacy"' dist/app/index.html
          grep -q 'Appearance & Display' dist/app/index.html
          grep -q 'data-settings-section="audio" aria-hidden="true"' dist/app/index.html

      - name: Verify release audio is disabled
        run: |
          grep -q 'sounds: EXPERIMENTAL_FEATURES && localStorage.getItem("limitSounds") === "true"' dist/app/index.html
          grep -q 'warning: EXPERIMENTAL_FEATURES && localStorage.getItem("overspeedWarning") !== "false"' dist/app/index.html
          grep -q 'greetingAudio: EXPERIMENTAL_FEATURES && localStorage.getItem("greetingAudio") !== "false"' dist/app/index.html

      - name: Verify support UI and test isolation
        run: |
          grep -q 'Help & privacy' dist/app/index.html
          grep -q 'support@frenano.app' dist/app/index.html
          grep -q 'Share diagnostic log' dist/app/index.html
          grep -q 'Nothing is uploaded automatically' dist/app/index.html
          grep -q 'data-settings-section="advanced-and-experimental-features" aria-hidden="true"' dist/app/index.html
          grep -q 'Experimental transport API disabled in stable build' dist/app/index.html
          grep -q '# build_channel=test' dist/app/index.html
          grep -q 'TEST VERSION' dist/app/index.html
