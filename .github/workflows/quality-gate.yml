name: Super Simple Speedo quality gate

on:
  push:
    paths:
      - "home.html"
      - "index.template.html"
      - "build.js"
      - "build-profile.json"
      - "netlify.toml"
      - "manifest.webmanifest"
      - "brand/**"
      - "icons/**"
      - "support-diagnostics.js"
      - "check-regressions.js"
      - "check-channel-contract.js"
      - "check-privacy.js"
      - "speed-engine.js"
      - "test-speed-engine.js"
      - "test-data/**"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "home.html"
      - "index.template.html"
      - "build.js"
      - "build-profile.json"
      - "netlify.toml"
      - "manifest.webmanifest"
      - "brand/**"
      - "icons/**"
      - "support-diagnostics.js"
      - "check-regressions.js"
      - "check-channel-contract.js"
      - "check-privacy.js"
      - "speed-engine.js"
      - "test-speed-engine.js"
      - "test-data/**"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify website image assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            'brand/start-up-and-website-logo.png',
            'brand/swiss-flag-website.png',
            'brand/dark-confirmed-inline.png',
            'brand/light-confirmed-inline.png',
            'brand/dark-estimate-inline.png',
            'icons/icon-192.png',
            'icons/icon-512.png',
            'icons/icon-1024.png'
          ];
          const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          for (const file of required) {
            const data = fs.readFileSync(file);
            if (data.length < 1000) throw new Error(`${file} is suspiciously small`);
            if (!data.subarray(0,8).equals(sig)) throw new Error(`${file} is not a PNG`);
            console.log(`OK ${file} (${data.length} bytes)`);
          }
          NODE

      - name: Check product and diagnostic contracts
        run: node check-regressions.js index.template.html

      - name: Check production privacy contracts
        run: node check-privacy.js

      - name: Replay speed behaviour fixtures
        run: node test-speed-engine.js

      - name: Build configured release output
        env:
          GEOAPIFY_API_KEY: test-key-not-for-production
        run: node build.js

      - name: Verify single-page website contract
        run: |
          test -f dist/home.html
          test -f dist/index.html
          test -f dist/brand/start-up-and-website-logo.png
          test -f dist/brand/swiss-flag-website.png
          test -f dist/brand/dark-confirmed-inline.png
          test -f dist/brand/light-confirmed-inline.png
          test -f dist/brand/dark-estimate-inline.png
          grep -q 'id="features"' dist/home.html
          grep -q 'id="about"' dist/home.html
          grep -q 'id="privacy"' dist/home.html
          grep -q 'id="contact"' dist/home.html
          grep -q 'brand/start-up-and-website-logo.png' dist/home.html
          grep -q 'brand/swiss-flag-website.png' dist/home.html
          grep -q 'brand/dark-confirmed-inline.png' dist/home.html
          grep -q 'brand/light-confirmed-inline.png' dist/home.html
          grep -q 'brand/dark-estimate-inline.png' dist/home.html
          grep -q 'Made in Switzerland' dist/home.html
          ! grep -qi 'Built with care' dist/home.html

      - name: Verify website routing contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('netlify.toml', 'utf8');
          const root = text.match(/\[\[redirects\]\][\s\S]*?from = "\/"[\s\S]*?(?=\n\[\[redirects\]\]|$)/);
          if (!root) throw new Error('Missing root redirect');
          if (!/to = "\/home\.html"/.test(root[0])) throw new Error('Root redirect must target /home.html');
          if (!/status = 200/.test(root[0])) throw new Error('Root redirect must be a 200 rewrite');
          if (!/force = true/.test(root[0])) throw new Error('Root rewrite must set force = true so /index.html cannot shadow the homepage');
          NODE
          grep -q 'from = "/web"' netlify.toml
          grep -q 'to = "/index.html"' netlify.toml
          grep -q 'from = "/privacy"' netlify.toml
          grep -q 'to = "/#privacy"' netlify.toml
          grep -q 'from = "/contact"' netlify.toml
          grep -q 'to = "/#contact"' netlify.toml

      - name: Verify support UI and channel isolation
        run: |
          grep -q 'Share diagnostic log' dist/index.html
          grep -q 'Nothing is uploaded automatically' dist/index.html
          grep -q 'data-settings-section="advanced-and-experimental-features" aria-hidden="true"' dist/index.html
          grep -q 'Experimental transport API disabled in stable build' dist/index.html
