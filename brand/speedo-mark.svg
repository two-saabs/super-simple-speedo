<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Super Simple Speedo logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a22"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20c9f4"/>
      <stop offset="1" stop-color="#118dff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7c9cd"/>
      <stop offset="1" stop-color="#a5aab0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="80" fill="none" stroke="#3b4852" stroke-width="3"/>

  <!-- Master blue sweep: thick, broad and slightly flattened across the crown. -->
  <path d="M58 322
           C61 196 157 100 286 96
           C333 95 375 105 413 125
           L370 171
           C345 159 317 153 288 154
           C194 157 124 229 121 322
           C120 343 107 357 89 357
           C70 357 57 344 58 322 Z"
        fill="url(#blue)"/>

  <!-- Master silver sweep: full right-hand segment, visibly broader and lower. -->
  <path d="M419 149
           C459 192 479 247 478 313
           C478 338 464 356 444 356
           C425 356 413 341 415 319
           C417 267 406 226 381 193
           Z"
        fill="url(#silver)"/>

  <!-- Needle lands cleanly in the gap between blue and silver. -->
  <path d="M239 313 L403 140 L276 337 Z" fill="#ffffff"/>
  <circle cx="250" cy="337" r="32" fill="#ffffff"/>
</svg>
