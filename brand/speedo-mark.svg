<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Super Simple Speedo logo">
  <defs>
    <linearGradient id="blueArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#24C7FF"/>
      <stop offset="100%" stop-color="#1188FF"/>
    </linearGradient>
    <linearGradient id="greyArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B7BBC0"/>
      <stop offset="100%" stop-color="#8D9298"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0A0F13"/>
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#2A343C" stroke-width="3"/>

  <!-- Use explicit cubic curves rather than SVG arc commands so WebKit renders
       the gauge consistently. The two segments share the same tangent at the join. -->
  <path d="M104 334 C104 188 222 112 334 132 C354 136 371 143 384 153"
        fill="none" stroke="url(#blueArc)" stroke-width="52" stroke-linecap="round"/>
  <path d="M384 153 C410 174 425 238 420 334"
        fill="none" stroke="url(#greyArc)" stroke-width="52" stroke-linecap="round"/>

  <path d="M258 304 L374 153 L282 322 Z" fill="#FFFFFF"/>
  <circle cx="264" cy="318" r="27" fill="#FFFFFF"/>
</svg>
