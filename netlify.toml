[build]
  command = "node build.js && node build/apply-startup-web.js"
  publish = "dist"

# Frenano is now the canonical home. Preserve paths when visitors arrive
# through any of the legacy Super Simple Speedo production hostnames.
[[redirects]]
  from = "/*"
  to = "https://frenano.app/:splat"
  status = 301
  force = true
  conditions = {Host = ["supersimplespeedo.app"]}

[[redirects]]
  from = "/*"
  to = "https://frenano.app/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.supersimplespeedo.app"]}

[[redirects]]
  from = "/*"
  to = "https://frenano.app/:splat"
  status = 301
  force = true
  conditions = {Host = ["super-simple-speedo.netlify.app"]}
